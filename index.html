<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <meta name="description" content="ScoutBolt - A strategic wood puzzle game">

    <title>ScoutBolt - Wood Puzzle</title>

    <!-- Pi SDK Ready - Uncomment when integrating -->
    <!-- <script src="https://sdk.minepi.com/pi-sdk.js"></script> -->

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Main Menu Screen -->
        <div id="main-menu" class="screen active" data-screen="menu">
            <div class="wood-decoration">
                <span class="bolt-icon">🔩</span>
            </div>
            <h1 class="logo">ScoutBolt</h1>
            <p class="subtitle">WOOD PUZZLE</p>
            <button class="btn btn-primary" id="btn-play">PLAY</button>
            <button class="btn btn-secondary" id="btn-levels">LEVELS</button>
            <button class="btn btn-secondary" id="btn-pi-login" style="display:none;">PI LOGIN</button>
        </div>

        <!-- Level Select Screen -->
        <div id="level-select" class="screen" data-screen="levels">
            <h2 class="screen-title">SELECT LEVEL</h2>
            <div class="levels-grid" id="levels-container"></div>
            <button class="btn btn-secondary" id="btn-back-menu">BACK</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen" data-screen="game">
            <div id="game-header">
                <button class="header-btn" id="btn-menu">← MENU</button>
                <div class="level-info">
                    <div class="level-title" id="current-level-title">Level 1</div>
                    <div class="moves-counter" id="moves-display">Moves: 0</div>
                </div>
                <button class="header-btn" id="btn-restart">↻ RESTART</button>
            </div>
            <canvas id="game-canvas"></canvas>
            <div class="instructions" id="game-instructions">
                Tap bolts in the correct order to release the wood plate
            </div>
        </div>

        <!-- Win Modal -->
        <div id="win-modal" class="modal">
            <div class="modal-content">
                <h2 class="modal-title">LEVEL COMPLETE!</h2>
                <div class="star-display" id="star-display">⭐⭐⭐</div>
                <p id="win-message" class="win-message">Perfect!</p>
                <div class="modal-buttons">
                    <button class="btn btn-small btn-secondary" id="btn-replay">REPLAY</button>
                    <button class="btn btn-small btn-primary" id="btn-next">NEXT →</button>
                </div>
            </div>
        </div>

        <!-- Pause Modal -->
        <div id="pause-modal" class="modal">
            <div class="modal-content">
                <h2 class="modal-title">PAUSED</h2>
                <div class="modal-buttons">
                    <button class="btn btn-secondary" id="btn-resume">RESUME</button>
                    <button class="btn btn-secondary" id="btn-pause-menu">MENU</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load modules in dependency order -->
    <script src="js/config.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
